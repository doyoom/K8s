# Secret 템플릿 파일 - 실제 배포 전 CHANGE_ME 값을 교체하거나 kubectl 명령으로 직접 생성하세요.
# 실제 자격증명 값을 이 파일에 채워서 커밋하지 마세요.
#
# 권장 생성 방법:
#   kubectl create secret generic minio-credentials \
#     --from-literal=root-user=<값> \
#     --from-literal=root-password=<값> \
#     --from-literal=access-key=<값> \
#     --from-literal=secret-key=<값> \
#     --namespace=storage --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic clickhouse-credentials \
#     --from-literal=password=<값> \
#     --namespace=storage --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl create secret generic grafana-credentials \
#     --from-literal=admin-password=<값> \
#     --from-literal=clickhouse-password=<값> \
#     --namespace=monitoring --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: storage
type: Opaque
stringData:
  root-user: "CHANGE_ME"
  root-password: "CHANGE_ME"
  access-key: "CHANGE_ME"
  secret-key: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default
type: Opaque
stringData:
  access-key: "CHANGE_ME"
  secret-key: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: storage
type: Opaque
stringData:
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: default
type: Opaque
stringData:
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: monitoring
type: Opaque
stringData:
  admin-password: "CHANGE_ME"
  clickhouse-password: "CHANGE_ME"
